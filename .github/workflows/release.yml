# v* etiketi pushlanınca Windows kurulumunu derler ve GitHub Releases'a yayınlar.
# Kurulu uygulamalar (electron-updater) buradaki latest.yml'yi okuyup kendini günceller.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Paketle ve yayınla
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
